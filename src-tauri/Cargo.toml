[package]
name = "three_r_waterline"
version = "0.1.0"
description = "A compact 3R subscription quota overlay"
authors = ["3R Waterline"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "three_r_waterline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
