[package]
name = "three_r_waterline"
version = "0.1.0"
description = "A compact 3R subscription quota overlay"
authors = ["3R Waterline"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "three_r_waterline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
keyring = { version = "3.6.2", default-features = false, features = ["windows-native", "apple-native"] }
reqwest = { version = "0.13.4", default-features = true, features = ["json"] }
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
