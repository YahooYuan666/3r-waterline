name: Build macOS community release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to receive the macOS DMG
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build universal macOS DMG
    runs-on: macos-14
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build universal macOS bundle
        run: npm run desktop:build -- --target universal-apple-darwin

      - name: Upload unsigned community DMG to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          gh release upload "$RELEASE_TAG" "$dmg_path" --clobber
